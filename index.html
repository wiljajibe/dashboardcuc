<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .tarjeta {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .tarjeta h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .numero {
      font-size: 32px;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mi Dashboard</h1>
    <p>Primera versión publicada con GitHub Pages</p>
  </header>

  <main>
    <div class="tarjetas">

      <div class="tarjeta">
        <h2>Total de registros</h2>
        <div class="numero">0</div>
      </div>

      <div class="tarjeta">
        <h2>Meta</h2>
        <div class="numero">0</div>
      </div>

      <div class="tarjeta">
        <h2>Porcentaje de avance</h2>
        <div class="numero">0%</div>
      </div>

    </div>
  </main>

</body>
</html>
