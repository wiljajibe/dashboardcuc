<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Creación de contraseña para el portal institucional CUC">
  <meta name="theme-color" content="#c8102e">
  <title>Crear contraseña · Portal CUC</title>
  <link rel="stylesheet" href="./assets/css/dashboard.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark">CUC</span>
      <div><strong>Universidad de la Costa</strong><br><small>Portal de indicadores</small></div>
    </div>
    <h1>Crear contraseña</h1>
    <p>Esta contraseña será únicamente para ingresar a los dashboards autorizados.</p>

    <form class="login-form" id="passwordForm">
      <label for="newPassword">Nueva contraseña
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <label for="confirmPassword">Confirmar contraseña
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <button id="passwordButton" type="submit">Guardar contraseña</button>
    </form>
    <div class="login-message" id="passwordMessage" role="status" aria-live="polite">Validando invitación…</div>
  </main>
  <script type="module" src="./assets/js/set-password.js"></script>
</body>
</html>
